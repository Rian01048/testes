<section class="pagina">
    <div class="container">
        <h2 class="titulo-pagina">Anúncios de Adoção</h2>

        <div class="area-pesquisa">
            <input type="text" class="busca" [(ngModel)]="termoPesquisa" placeholder="Buscar cidade ou bairro...">
            <button class="btn-pesquisar" (click)="pesquisar()">Buscar</button>
        </div>

        <p class="vazio" *ngIf="petsFiltrados.length === 0">Nenhum pet encontrado para esta pesquisa.</p>

        <div class="card-lista" *ngFor="let pet of petsFiltrados">
            <img [src]="pet.imagem" alt="Foto do pet">
            <div class="dados-lista">
                <h3>{{ pet.nome || 'Sem Nome' }}</h3>
                <p class="adocao-texto">{{ pet.situacao }}</p>
                <p class="localizacao-texto">{{ pet.bairro }} - {{ pet.cidade }}</p>
            </div>
            <button class="btn-ver" (click)="abrirInfo(pet)">Ver Info</button>
        </div>
    </div>
</section>
