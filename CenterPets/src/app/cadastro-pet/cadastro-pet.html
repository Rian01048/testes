<section class="pagina">
    <div class="container">
        <form class="card" (submit)="publicar()">
            <h2>Publicar Animal</h2>

            <label>Foto do Animal</label>
            <label class="upload-area">
        <div class="upload-conteudo">
          <span *ngIf="!novoPet.imagem">📸 Clique para foto</span>
          <span *ngIf="novoPet.imagem" class="adocao-texto">✅ Foto carregada!</span>
        </div>
        <input type="file" (change)="processarImagem($event)" accept="image/*">
      </label>

            <label>Nome (opcional)</label>
            <input type="text" [(ngModel)]="novoPet.nome" name="nome" placeholder="Digite o nome">

            <label>Espécie</label>
            <div class="opcoes-container">
                <button type="button" class="btn-opcao" [class.ativo]="novoPet.especie === 'Cachorro'" (click)="novoPet.especie = 'Cachorro'">Cachorro</button>
                <button type="button" class="btn-opcao" [class.ativo]="novoPet.especie === 'Gato'" (click)="novoPet.especie = 'Gato'">Gato</button>
            </div>

            <label>Situação</label>
            <div class="opcoes-container">
                <button type="button" class="btn-opcao" [class.ativo]="novoPet.situacao === 'Adoção'" (click)="novoPet.situacao = 'Adoção'">Adoção</button>
                <button type="button" class="btn-opcao" [class.ativo]="novoPet.situacao === 'Perdido'" (click)="novoPet.situacao = 'Perdido'">Perdido</button>
            </div>

            <label>Bairro / Cidade</label>
            <input type="text" [(ngModel)]="novoPet.bairro" name="bairro" placeholder="Bairro">
            <input type="text" [(ngModel)]="novoPet.cidade" name="cidade" placeholder="Cidade">

            <label>Telefone</label>
            <input type="tel" [(ngModel)]="novoPet.tel" name="tel" placeholder="(00) 00000-0000">

            <label *ngIf="novoPet.situacao === 'Adoção'">Valor VIP (opcional)</label>
            <input type="text" *ngIf="novoPet.situacao === 'Adoção'" [(ngModel)]="novoPet.preco" name="preco" placeholder="Ex: 200,00">

            <button type="submit" class="btn-verde">Publicar Anúncio</button>
        </form>
    </div>
</section>
